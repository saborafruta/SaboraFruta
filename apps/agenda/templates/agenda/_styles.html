<style>
  .agenda-shell{max-width:1180px;margin:0 auto;color:#e5e7eb}.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}.agenda-title{font-size:1.55rem;font-weight:800}.agenda-actions{display:flex;gap:.6rem;flex-wrap:wrap}.agenda-btn{display:inline-flex;align-items:center;justify-content:center;padding:.65rem 1rem;border-radius:.65rem;font-weight:700;text-decoration:none;background:#2563eb;color:#fff;border:0;cursor:pointer}.agenda-btn.danger{background:#991b1b}.agenda-btn.secondary{background:#27272a;color:#e5e7eb;border:1px solid #3f3f46}.agenda-card{background:#242426;border:1px solid #343438;border-radius:1rem;padding:1rem;box-shadow:0 8px 24px rgba(0,0,0,.12)}.agenda-grid{display:grid;gap:1rem}.agenda-filters{display:grid;grid-template-columns:1fr 1fr auto;gap:.75rem;align-items:end}.agenda-field label{display:block;font-size:.78rem;font-weight:700;margin-bottom:.35rem;color:#a1a1aa}.agenda-field input,.agenda-field select,.agenda-field textarea{width:100%;border:1px solid #3f3f46;border-radius:.6rem;background:#18181b;color:#f4f4f5;padding:.65rem}.agenda-list{display:grid;gap:.65rem;margin-top:1rem}.agenda-item{display:grid;grid-template-columns:90px 1fr auto;gap:1rem;align-items:center;padding:.85rem;border:1px solid #3f3f46;border-radius:.75rem}.agenda-item-link{text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}.agenda-item-link:hover{border-color:#2563eb;transform:translateY(-1px)}.agenda-time{font-size:1.05rem;font-weight:800}.agenda-muted{color:#a1a1aa;font-size:.82rem}.agenda-badge{padding:.25rem .55rem;border-radius:999px;background:#1e3a8a;color:#bfdbfe;font-size:.72rem;font-weight:700}.agenda-errors{background:#7f1d1d;color:#fecaca;padding:.8rem;border-radius:.7rem;margin-bottom:1rem}.agenda-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.agenda-form-grid .full{grid-column:1/-1}.agenda-day{display:grid;grid-template-columns:150px 8
