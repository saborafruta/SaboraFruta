<script>
  window.inicializarClassificacaoEdicao = function (raiz) {
    (raiz || document).querySelectorAll('[data-classificacao-pagar-edicao]').forEach(function (bloco) {
      if (bloco.dataset.inicializado === '1') return;
      bloco.dataset.inicializado = '1';
      const grupo = bloco.querySelector('[data-categoria-grupo]');
      const subgrupo = bloco.querySelector('[data-categoria-subgrupo]');
      const categoria = bloco.querySelector('[data-categoria-especifica]');
      const original = bloco.querySelector('[data-plano-contas-original] select');
      if (!grupo || !subgrupo || !categoria || !original) return;

      const filtrar = function (select, atributo, valor) {
        Array.from(select.options).forEach(function (option, indice) {
          if (indice === 0) return;
          const visivel = Boolean(valor) && option.dataset[atributo] === valor;
          option.hidden = !visivel;
          option.disabled = !visivel;
        });
      };
      const atualizarCategorias = function () {
        filtrar(categoria, 'subgrupo', subgrupo.value);
        if (categoria.selectedOptions[0]?.disabled) categoria.value = '';
        original.value = categoria.value;
      };
      const atualizarSubgrupos = function () {
        filtrar(subgrupo, 'grupo', grupo.value);
        if (subgrupo.selectedOptions[0]?.disabled) subgrupo.value = '';
        atualizarCategorias();
      };

      grupo.addEventListener('change', function () {
        subgrupo.value = '';
        categoria.value = '';
        atualizarSubgrupos();
      });
      subgrupo.addEventListener('change', function () {
        categoria.value = '';
        atualizarCategorias();
      });
      categoria.addEventListener('change', function () {
        original.value = categoria.value;
      });
      atualizarSubgrupos();
    });
  };

  window.toggleEditarLancamento = function (elemento) {
    const detalhe = elemento.closest('[data-conta-detail]');
    const painel = detalhe && detalhe.querySelector('[data-editar-lancamento-panel]');
    if (!painel) return;
    painel.hidden = !painel.hidden;
    if (!painel.hidden) {
      window.inicializarClassificacaoEdicao(painel);
      painel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      painel.querySelector('select, input, textarea')?.focus();
    }
  };

  window.salvarEdicaoLancamento = async function (evento, formulario) {
    evento.preventDefault();
    const feedback = formulario.querySelector('[data-editar-lancamento-feedback]');
    const botao = formulario.querySelector('button[type="submit"]');
    const detalhe = formulario.closest('[data-conta-detail]');
    feedback.className = 'hidden text-sm';
    botao.disabled = true;
    botao.textContent = 'Salvando...';
    try {
      const resposta = await fetch(formulario.action, {
        method: 'POST',
        body: new FormData(formulario),
        headers: {'X-Requested-With': 'XMLHttpRequest'}
      });
      const dados = await resposta.json();
      if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível editar o lançamento.');
      feedback.textContent = dados.mensagem;
      feedback.className = 'text-sm text-emerald-500';

      const separador = dados.detail_url.includes('?') ? '&' : '?';
      const atualizada = await fetch(dados.detail_url + separador + 'modal=1', {
        headers: {'X-Requested-With': 'XMLHttpRequest'}
      });
      if (atualizada.ok) {
        const html = await atualizada.text();
        detalhe.outerHTML = html;
      }
    } catch (erro) {
      feedback.textContent = erro.message;
      feedback.className = 'text-sm text-rose-500';
    } finally {
      botao.disabled = false;
      botao.textContent = 'Salvar alterações';
    }
  };

  window.alterarExclusaoLancamento = async function (evento, formulario) {
    evento.preventDefault();
    const botao = formulario.querySelector('button[type="submit"]');
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = 'Processando...';
    try {
      const resposta = await fetch(formulario.action, {
        method: 'POST', body: new FormData(formulario),
        headers: {'X-Requested-With': 'XMLHttpRequest'}
      });
      const dados = await resposta.json();
      if (!resposta.ok || !dados.ok) throw new Error(dados.erro || 'Não foi possível concluir a ação.');
      window.location.reload();
    } catch (erro) {
      window.alert(erro.message);
      botao.disabled = false;
      botao.textContent = textoOriginal;
    }
    return false;
  };
</script>
