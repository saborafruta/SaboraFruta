{% load widget_tweaks %}
<div>
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium" :style="temaClaro ? 'color:#374151;' : 'color:#d1d5db;'">
    {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
  </label>
  {{ field|add_class:"form-input" }}
  {% if field.errors %}<p class="mt-1 text-xs text-red-500">{{ field.errors|join:", " }}</p>{% endif %}
</div>
