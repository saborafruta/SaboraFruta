<article class="rounded-md border p-3">
  <h4 class="text-sm font-semibold">{{ titulo }}</h4>
  {% if grafico.fatias %}
    <div class="mt-3 flex flex-col items-center gap-4 sm:flex-row lg:flex-col xl:flex-row">
      <div class="paid-pie shrink-0" style="background:{{ grafico.gradiente }}" role="img" aria-label="Gráfico de pizza de {{ titulo|lower }}"></div>
      <div class="min-w-0 flex-1 space-y-1.5 text-xs">
        {% for fatia in grafico.fatias %}
          <div class="flex items-center justify-between gap-2">
            <span class="min-w-0 truncate"><span class="mr-1.5 inline-block h-2.5 w-2.5 rounded-sm" style="background:{{ fatia.cor }}"></span>{{ fatia.nome }}</span>
            <strong class="whitespace-nowrap">{{ fatia.percentual|floatformat:1 }}%</strong>
          </div>
        {% endfor %}
      </div>
    </div>
  {% else %}
    <p class="mt-3 text-xs opacity-60">{{ vazio }}</p>
  {% endif %}
</article>
