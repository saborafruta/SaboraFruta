<article class="paid-chart-card rounded-lg border p-4">
  <div><h4 class="text-sm font-semibold">{{ titulo }}</h4>{% if descricao %}<p class="mt-1 text-xs opacity-60">{{ descricao }}</p>{% endif %}</div>
  {% if grafico.fatias %}
    <div class="mt-4 grid items-center gap-5 sm:grid-cols-[190px_minmax(0,1fr)]">
      <svg class="paid-donut mx-auto" viewBox="0 0 42 42" role="img" aria-label="Gráfico de rosca de {{ titulo|lower }}">
        <circle class="paid-donut-track" cx="21" cy="21" r="15.9155" fill="none" stroke-width="8"></circle>
        {% for fatia in grafico.fatias %}
          <circle class="paid-donut-slice" cx="21" cy="21" r="15.9155" fill="none" stroke="{{ fatia.cor }}" stroke-width="8" pathLength="100" stroke-dasharray="{{ fatia.percentual_svg }} {{ fatia.restante_svg }}" stroke-dashoffset="{{ fatia.offset_svg }}" transform="rotate(-90 21 21)" tabindex="0">
            <title>{{ fatia.nome }} — R$ {{ fatia.valor|floatformat:2 }} ({{ fatia.percentual|floatformat:1 }}%)</title>
          </circle>
        {% endfor %}
        <text x="21" y="19.8" text-anchor="middle" class="paid-donut-label">TOTAL</text>
        <text x="21" y="23.2" text-anchor="middle" class="paid-donut-total">R$ {{ grafico.total|floatformat:0 }}</text>
      </svg>
      <div class="min-w-0 space-y-2 text-xs">
        {% for fatia in grafico.fatias %}
          <div class="paid-chart-legend flex items-start justify-between gap-3 rounded-md px-2 py-1.5" title="{{ fatia.nome }} — R$ {{ fatia.valor|floatformat:2 }}">
            <span class="min-w-0 leading-4"><span class="mr-1.5 inline-block h-2.5 w-2.5 rounded-sm" style="background:{{ fatia.cor }}"></span>{{ fatia.nome }}</span>
            <span class="shrink-0 text-right"><strong class="block">{{ fatia.percentual|floatformat:1 }}%</strong><small class="opacity-55">R$ {{ fatia.valor|floatformat:2 }}</small></span>
          </div>
        {% endfor %}
      </div>
    </div>
  {% else %}
    <p class="mt-3 text-xs opacity-60">{{ vazio }}</p>
  {% endif %}
</article>
