<div x-data="{
  aberto:false, usuario:'', campo:'', dataIni:'', dataFim:'',
  visivel(data, usuario, campos) {
    return (!this.usuario || this.usuario === usuario)
      && (!this.campo || campos.includes(this.campo))
      && (!this.dataIni || data >= this.dataIni)
      && (!this.dataFim || data <= this.dataFim);
  },
  limpar() { this.usuario=''; this.campo=''; this.dataIni=''; this.dataFim=''; }
}">
  <button type="button" class="btn-secondary inline-flex items-center gap-2" @click="aberto=true; document.body.style.overflow='hidden'">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/></svg>
    Log bancário
  </button>
  <template x-teleport="body">
    <div x-show="aberto" x-cloak class="fixed inset-0 flex items-center justify-center p-3 sm:p-6"
         style="z-index:10000;background:rgba(15,23,42,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)"
         @keydown.escape.window="aberto=false;document.body.style.overflow=''" @click.self="aberto=false;document.body.style.overflow=''">
      <section role="dialog" aria-modal="true" aria-label="Log bancário"
               class="flex max-h-[92vh] w-full max-w-4xl flex-col overflow-hidden rounded-lg bg-white text-slate-900 shadow-2xl dark:bg-[#202024] dark:text-slate-100">
        <div class="flex items-start justify-between gap-4 border-b border-blue-200 bg-blue-50 px-4 py-4 dark:border-blue-900/60 dark:bg-blue-950/30 sm:px-6">
          <div><h3 class="text-lg font-semibold">Log bancário{% if conta_selecionada %} · {{ conta_selecionada.descricao|default:conta_selecionada.banco_nome }}{% endif %}</h3><p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Quem fez, quando fez, o que mudou e o motivo informado.</p></div>
          <button type="button" class="btn-secondary" @click="aberto=false;document.body.style.overflow=''">Fechar</button>
        </div>
        <div class="border-b border-slate-200 p-4 dark:border-slate-700 sm:px-6">
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
            <label class="text-xs font-semibold">De<input type="date" class="form-input mt-1" x-model="dataIni"></label>
            <label class="text-xs font-semibold">Até<input type="date" class="form-input mt-1" x-model="dataFim"></label>
            <label class="text-xs font-semibold">Usuário<select class="form-input mt-1" x-model="usuario"><option value="">Todos os usuários</option>{% for nome in usuarios_log_bancario %}<option value="{{ nome }}">{{ nome }}</option>{% endfor %}</select></label>
            <label class="text-xs font-semibold">Campo<select class="form-input mt-1" x-model="campo"><option value="">Todos os campos</option>{% for nome in campos_log_bancario %}<option value="{{ nome }}">{{ nome }}</option>{% endfor %}</select></label>
            <button type="button" class="btn-secondary self-end" @click="limpar()">Limpar filtros</button>
          </div>
        </div>
        <div class="min-h-0 flex-1 space-y-3 overflow-y-auto p-4 sm:px-6">
          {% for log in logs_bancarios %}
          <article x-data="{detalhes:false}"
                   x-show="visivel('{{ log.data|date:'Y-m-d' }}','{{ log.usuario|escapejs }}','{% for item in log.alteracoes %}{{ item.campo|escapejs }}|{% endfor %}')"
                   class="rounded-lg border border-blue-100 bg-blue-50/60 p-4 dark:border-blue-900/40 dark:bg-blue-950/15">
            <div class="grid gap-3 text-sm sm:grid-cols-[1fr_1fr_1.2fr_.6fr_1.5fr]">
              <div><span class="block text-[10px] font-semibold uppercase text-slate-500">Quando</span><strong>{{ log.data|date:"d/m/Y H:i" }}</strong></div>
              <div><span class="block text-[10px] font-semibold uppercase text-slate-500">Quem</span><strong>{{ log.usuario }}</strong></div>
              <div><span class="block text-[10px] font-semibold uppercase text-slate-500">O que fez</span><span class="soft-pill is-blue">{{ log.acao }}</span></div>
              <div><span class="block text-[10px] font-semibold uppercase text-slate-500">Quanto</span><strong>{{ log.alteracoes|length }} campo{{ log.alteracoes|length|pluralize }}</strong></div>
              <div><span class="block text-[10px] font-semibold uppercase text-slate-500">Detalhe</span><p>{{ log.justificativa|default:log.descricao }}</p>{% if log.alteracoes %}<button type="button" class="mt-2 text-xs font-semibold text-blue-600" @click="detalhes=!detalhes" x-text="detalhes ? 'Ocultar' : 'Ver tudo'"></button>{% endif %}</div>
            </div>
            {% if log.alteracoes %}<div x-show="detalhes" x-cloak class="mt-4 grid gap-2 border-t border-blue-100 pt-3 sm:grid-cols-2 dark:border-blue-900/40">{% for alteracao in log.alteracoes %}<div class="rounded-md bg-white p-3 text-xs shadow-sm dark:bg-[#29292d]"><strong class="block">{{ alteracao.campo }}</strong><span class="mt-1 block text-rose-600">Antes: {{ alteracao.antes }}</span><span class="block text-emerald-600">Depois: {{ alteracao.depois }}</span></div>{% endfor %}</div>{% endif %}
          </article>
          {% empty %}<p class="py-12 text-center text-sm text-slate-500">Nenhuma alteração bancária registrada.</p>{% endfor %}
        </div>
      </section>
    </div>
  </template>
</div>
