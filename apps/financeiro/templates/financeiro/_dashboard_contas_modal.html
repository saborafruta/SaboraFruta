<div x-data="{ aberto:false }" x-effect="document.body.style.overflow = aberto ? 'hidden' : ''">
  <button type="button" @click="aberto=true" class="btn-secondary whitespace-nowrap">
    Visão financeira
  </button>

  <template x-teleport="body">
    <div x-show="aberto" x-cloak @keydown.escape.window="aberto=false"
         class="fixed inset-0 flex items-center justify-center p-0 sm:p-5"
         style="z-index:120;background:rgba(15,23,42,.72);"
         role="dialog" aria-modal="true" aria-label="Visão financeira"
         @click.self="aberto=false">
      <section class="flex h-full w-full flex-col overflow-hidden sm:h-auto sm:rounded-lg"
               style="max-height:calc(100vh - 2.5rem);max-width:72rem"
               :style="temaClaro ? 'background:#f8fafc;color:#111827' : 'background:#18181b;color:#f8fafc'">
        <header class="flex items-start justify-between gap-4 border-b px-4 py-4 sm:px-6"
                :style="temaClaro ? 'border-color:#e2e8f0;background:#fff' : 'border-color:#303038;background:#202024'">
          <div>
            <p class="text-xs font-semibold uppercase text-blue-500">Análise consolidada</p>
            <h2 class="mt-1 text-xl font-semibold">Contas a pagar e receber</h2>
            <p class="mt-1 text-xs opacity-60">Posição em {{ dashboard_contas.hoje|date:"d/m/Y" }} · valores da filial atual</p>
          </div>
          <button type="button" @click="aberto=false" class="grid h-9 w-9 place-items-center rounded-md border text-xl" aria-label="Fechar">×</button>
        </header>

        <div class="flex-1 overflow-y-auto">
          <div class="grid grid-cols-2 border-b lg:grid-cols-4"
               :style="temaClaro ? 'border-color:#e2e8f0;background:#fff' : 'border-color:#303038;background:#202024'">
            <div class="border-b p-4 lg:border-b-0 lg:border-r" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <span class="text-xs uppercase opacity-60">Saldo projetado</span>
              <strong class="mt-1 block text-xl {% if dashboard_contas.saldo_projetado < 0 %}text-red-500{% else %}text-emerald-500{% endif %}">R$ {{ dashboard_contas.saldo_projetado|floatformat:2 }}</strong>
              <span class="text-xs opacity-60">Receber menos pagar em aberto</span>
            </div>
            <div class="border-b p-4 lg:border-b-0 lg:border-r" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <span class="text-xs uppercase opacity-60">A receber</span>
              <strong class="mt-1 block text-xl text-blue-500">R$ {{ dashboard_contas.receber.aberto|floatformat:2 }}</strong>
              <span class="text-xs opacity-60">{{ dashboard_contas.receber.qtd_aberto }} título{{ dashboard_contas.receber.qtd_aberto|pluralize }}</span>
            </div>
            <div class="border-r p-4" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <span class="text-xs uppercase opacity-60">A pagar</span>
              <strong class="mt-1 block text-xl text-orange-500">R$ {{ dashboard_contas.pagar.aberto|floatformat:2 }}</strong>
              <span class="text-xs opacity-60">{{ dashboard_contas.pagar.qtd_aberto }} título{{ dashboard_contas.pagar.qtd_aberto|pluralize }}</span>
            </div>
            <div class="p-4">
              <span class="text-xs uppercase opacity-60">Resultado realizado no mês</span>
              <strong class="mt-1 block text-xl {% if dashboard_contas.saldo_realizado_mes < 0 %}text-red-500{% else %}text-emerald-500{% endif %}">R$ {{ dashboard_contas.saldo_realizado_mes|floatformat:2 }}</strong>
              <span class="text-xs opacity-60">Recebimentos menos pagamentos</span>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-0 lg:grid-cols-3">
            <section class="border-b p-4 sm:p-6 lg:col-span-2 lg:border-b-0 lg:border-r" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <div class="mb-4 flex items-end justify-between gap-3">
                <div><h3 class="font-semibold">Agenda financeira</h3><p class="text-xs opacity-60">Comparação dos saldos por vencimento</p></div>
                <div class="flex gap-3 text-xs"><span class="text-blue-500">● Receber</span><span class="text-orange-500">● Pagar</span></div>
              </div>
              <div class="space-y-4">
                {% for item in dashboard_contas.agenda %}
                  <div>
                    <div class="mb-1 flex items-center justify-between gap-3 text-xs"><span class="font-semibold">{{ item.label }}</span><span class="opacity-60">R$ {{ item.receber|floatformat:2 }} / R$ {{ item.pagar|floatformat:2 }}</span></div>
                    <div class="space-y-1">
                      <div class="h-2 overflow-hidden rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full bg-blue-500" style="width:{{ item.receber_pct }}%"></div></div>
                      <div class="h-2 overflow-hidden rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full bg-orange-500" style="width:{{ item.pagar_pct }}%"></div></div>
                    </div>
                  </div>
                {% endfor %}
              </div>
            </section>

            <section class="border-b p-4 sm:p-6 lg:border-b-0" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <h3 class="font-semibold">Pontos de atenção</h3>
              <div class="mt-4 space-y-3 text-sm">
                <a href="{% url 'financeiro:receber_list' %}?status=vencido" class="flex items-center justify-between gap-3 border-b pb-3" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
                  <span><strong class="block text-red-500">Recebimentos vencidos</strong><small class="opacity-60">{{ dashboard_contas.receber.qtd_vencido }} título{{ dashboard_contas.receber.qtd_vencido|pluralize }}</small></span>
                  <strong>R$ {{ dashboard_contas.receber.vencido|floatformat:2 }}</strong>
                </a>
                <a href="{% url 'financeiro:pagar_list' %}?status=vencido" class="flex items-center justify-between gap-3 border-b pb-3" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
                  <span><strong class="block text-red-500">Pagamentos vencidos</strong><small class="opacity-60">{{ dashboard_contas.pagar.qtd_vencido }} título{{ dashboard_contas.pagar.qtd_vencido|pluralize }}</small></span>
                  <strong>R$ {{ dashboard_contas.pagar.vencido|floatformat:2 }}</strong>
                </a>
                <div class="flex items-center justify-between gap-3 border-b pb-3" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
                  <span><strong class="block">Próximos 7 dias</strong><small class="opacity-60">Pressão imediata de caixa</small></span>
                  <span class="text-right text-xs"><strong class="block text-blue-500">+ R$ {{ dashboard_contas.receber.sete|floatformat:2 }}</strong><strong class="block text-orange-500">- R$ {{ dashboard_contas.pagar.sete|floatformat:2 }}</strong></span>
                </div>
                {% if dashboard_contas.pagar.sem_categoria %}
                  <a href="{% url 'financeiro:pagar_list' %}" class="flex items-center justify-between gap-3 text-amber-500"><span><strong class="block">Sem categoria financeira</strong><small class="opacity-75">Revise a classificação</small></span><strong>R$ {{ dashboard_contas.pagar.sem_categoria|floatformat:2 }}</strong></a>
                {% endif %}
              </div>
            </section>
          </div>

          <div class="border-t px-4 pt-4 sm:px-6 sm:pt-6" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
            <h3 class="font-semibold">Distribuição financeira</h3>
            <p class="text-xs opacity-60">Compare a concentração por origem e destino do dinheiro</p>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
            <section class="border-b p-4 sm:p-6 lg:border-r" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <h3 class="font-semibold">Maiores saldos a receber</h3><p class="mb-4 text-xs opacity-60">Concentração por cliente</p>
              <div class="space-y-3">
                {% for item in dashboard_contas.maiores_clientes %}<div><div class="mb-1 flex justify-between gap-3 text-xs"><span class="truncate">{{ item.nome }}</span><strong>R$ {{ item.total|floatformat:2 }}</strong></div><div class="h-1.5 rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full bg-blue-500" style="width:{{ item.percentual }}%"></div></div></div>{% empty %}<p class="text-sm opacity-60">Nenhum saldo a receber em aberto.</p>{% endfor %}
              </div>
            </section>
            <section class="border-b p-4 sm:p-6">
              <h3 class="font-semibold">Formas de pagamento</h3><p class="mb-4 text-xs opacity-60">Distribuição prevista dos compromissos em aberto</p>
              <div class="space-y-3">
                {% for item in dashboard_contas.maiores_formas %}<div><div class="mb-1 flex justify-between gap-3 text-xs"><span class="truncate">{{ item.nome }}</span><strong>R$ {{ item.total|floatformat:2 }}</strong></div><div class="h-1.5 rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full bg-violet-500" style="width:{{ item.percentual }}%"></div></div></div>{% empty %}<p class="text-sm opacity-60">Nenhuma forma prevista nos títulos em aberto.</p>{% endfor %}
              </div>
            </section>
            <section class="border-b p-4 sm:p-6 lg:border-b-0 lg:border-r" :style="temaClaro ? 'border-color:#e2e8f0' : 'border-color:#303038'">
              <h3 class="font-semibold">Contas bancárias</h3><p class="mb-4 text-xs opacity-60">Saldo atual por conta cadastrada</p>
              <div class="space-y-3">
                {% for item in dashboard_contas.contas_bancarias %}<div><div class="mb-1 flex justify-between gap-3 text-xs"><span class="truncate">{{ item.nome }}</span><strong class="{% if item.total < 0 %}text-red-500{% else %}text-emerald-500{% endif %}">R$ {{ item.total|floatformat:2 }}</strong></div><div class="h-1.5 rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full {% if item.total < 0 %}bg-red-500{% else %}bg-emerald-500{% endif %}" style="width:{{ item.percentual }}%"></div></div></div>{% empty %}<p class="text-sm opacity-60">Nenhuma conta bancária cadastrada.</p>{% endfor %}
              </div>
            </section>
            <section class="p-4 sm:p-6">
              <h3 class="font-semibold">Categorias financeiras</h3><p class="mb-4 text-xs opacity-60">Concentração dos compromissos em aberto</p>
              <div class="space-y-3">
                {% for item in dashboard_contas.maiores_categorias %}<div><div class="mb-1 flex justify-between gap-3 text-xs"><span class="truncate">{{ item.nome }}</span><strong>R$ {{ item.total|floatformat:2 }}</strong></div><div class="h-1.5 rounded-sm" :style="temaClaro ? 'background:#e2e8f0' : 'background:#303038'"><div class="h-full bg-orange-500" style="width:{{ item.percentual }}%"></div></div></div>{% empty %}<p class="text-sm opacity-60">Nenhum compromisso classificado em aberto.</p>{% endfor %}
              </div>
            </section>
          </div>
        </div>

        <footer class="flex flex-wrap items-center justify-between gap-2 border-t px-4 py-3 sm:px-6" :style="temaClaro ? 'border-color:#e2e8f0;background:#fff' : 'border-color:#303038;background:#202024'">
          <span class="text-xs opacity-60">Clique nos vencidos para abrir a lista já filtrada.</span>
          <div class="flex flex-wrap gap-2"><a href="{% url 'financeiro:fluxo_caixa' %}" class="btn-secondary">Fluxo de caixa</a><a href="{% url 'financeiro:receber_list' %}" class="btn-secondary">A receber</a><a href="{% url 'financeiro:pagar_list' %}" class="btn-secondary">A pagar</a></div>
        </footer>
      </section>
    </div>
  </template>
</div>
