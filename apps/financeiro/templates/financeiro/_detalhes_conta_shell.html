<template x-teleport="body">
  <div x-show="detalheAberto" x-cloak
       class="fixed inset-0 flex items-center justify-center p-0 sm:p-5"
       style="z-index:180"
       style="background:rgba(15,23,42,.82);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)"
       @keydown.escape.window="fecharDetalhe()" @click.self="fecharDetalhe()"
       role="dialog" aria-modal="true" aria-label="Detalhes do título">
    <section class="flex h-full w-full max-w-5xl flex-col overflow-hidden shadow-2xl sm:h-auto sm:max-h-[calc(100vh-3rem)] sm:rounded-lg"
             :style="temaClaro ? 'max-height:calc(100vh - 2rem);background:#ffffff;color:#172033;box-shadow:0 24px 70px rgba(2,6,23,.38)' : 'max-height:calc(100vh - 2rem);background:#202024;color:#f8fafc;box-shadow:0 24px 70px rgba(0,0,0,.6)'">
      <div class="flex items-center justify-between gap-4 border-b px-4 py-3 text-white sm:px-6"
           style="border-color:#334155;background:#172033">
        <div><strong>Detalhes do título</strong><p class="text-xs opacity-60">Consulte sem sair da listagem</p></div>
        <button type="button" @click="fecharDetalhe()" class="flex h-9 w-9 items-center justify-center rounded-md border border-white/30 text-xl text-white" aria-label="Fechar">&times;</button>
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto p-4 sm:p-6">
        <div x-show="detalheCarregando" class="flex min-h-52 items-center justify-center text-sm opacity-65">Carregando detalhes...</div>
        <div x-show="detalheErro" class="rounded-md border border-rose-400/40 bg-rose-500/10 p-4 text-sm text-rose-500" x-text="detalheErro"></div>
        <div data-receber-detalhe-content x-show="!detalheCarregando && !detalheErro" x-html="detalheHtml"></div>
      </div>
    </section>
  </div>
</template>
{% include "financeiro/pagar/_editar_valor_script.html" %}
