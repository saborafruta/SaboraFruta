<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1e">
  <title>Imagem indisponível · iTED</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(32rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; text-align: center; }
    .marca { margin: 0 0 1.5rem; color: #93c5fd; font-size: .9rem; font-weight: 700; letter-spacing: .12em; }
    .icone { display: grid; width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; place-items: center; border-radius: 50%; background: #78350f; color: #fde68a; font-size: 1.8rem; }
    h1 { margin: 0; font-size: 1.35rem; }
    p { margin: .75rem 0 1.5rem; color: #d1d5db; line-height: 1.6; }
    a { display: inline-block; padding: .8rem 1.2rem; border-radius: .6rem; background: #2563eb; color: white; font-weight: 650; text-decoration: none; }
    a:hover, a:focus-visible { background: #1d4ed8; outline: 2px solid #93c5fd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="marca">iTED</p>
    <div class="icone" aria-hidden="true">!</div>
    <h1>Esta imagem não está disponível</h1>
    <p>A origem da foto não permitiu o acesso. Volte ao sistema para continuar trabalhando.</p>
    <a href="{% url 'core:inicio' %}">Voltar ao sistema</a>
  </main>
</body>
</html>
