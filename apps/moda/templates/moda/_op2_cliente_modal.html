<div x-show="modalCliente" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,.68)" @click.self="if(!salvando) modalCliente=false" @keydown.escape.window="if(!salvando) modalCliente=false">
  <form x-ref="novo" @submit.prevent="salvarCliente()" role="dialog" aria-modal="true" aria-label="Cadastro de cliente" class="card p-5 w-full max-w-3xl overflow-y-auto" style="max-height:92vh">
    {% csrf_token %}
    <div class="flex justify-between gap-3 mb-4"><div><h2 class="text-xl font-bold" x-text="clienteEditandoId?'Editar cliente':'Novo cliente'"></h2><p class="text-xs opacity-70 mt-1">Salve o cadastro sem sair do orçamento ou da OP.</p></div><button type="button" :disabled="salvando" @click="modalCliente=false" aria-label="Fechar cadastro" class="text-2xl">×</button></div>
    <fieldset :disabled="clienteCarregando || salvando" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      {% for campo in form_cliente %}<div class="{% if campo.name == 'razao_social' %}sm:col-span-2{% endif %}"><label class="block text-sm"><span class="block mb-1">{{ campo.label }}</span>{{ campo }}</label>{% if campo.help_text %}<small class="block mt-1 opacity-60">{{ campo.help_text }}</small>{% endif %}<small class="block mt-1" style="color:#ef4444" x-text="erros['{{ campo.name }}'] || ''"></small></div>{% endfor %}
    </fieldset>
    <small class="block mt-3" style="color:#ef4444" x-text="erros.__all__ || ''"></small>
    <p x-show="erro" x-text="erro" role="alert" class="mt-3 text-sm" style="color:#ef4444"></p>
    <div class="flex justify-end gap-2 mt-5"><button type="button" class="btn-secondary" :disabled="salvando" @click="modalCliente=false">Cancelar</button><button class="btn-primary" :disabled="salvando || clienteCarregando" x-text="salvando?'Salvando...':'Salvar cliente'"></button></div>
  </form>
</div>
