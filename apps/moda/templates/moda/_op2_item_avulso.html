<div class="mt-3 pt-3" style="border-top:1px solid rgba(148,163,184,.22)">
  <label>
    <span class="op2-label">Item avulso</span>
    <div class="flex gap-2">
      <input x-ref="itemAvulsoNome" x-model="draft.descricao" maxlength="160"
             class="form-input flex-1 min-w-[190px]"
             placeholder="Nome do item, ex.: Faixa personalizada"
             @keydown.enter.prevent="usarItemAvulso()">
      <button x-show="podeAdicionarVariosAvulsos()" type="button"
              class="btn-secondary shrink-0" style="width:42px;padding:0;justify-content:center"
              :disabled="!String(draft.descricao||'').trim()"
              aria-label="Adicionar outro item avulso" title="Adicionar à lista"
              @click="usarItemAvulso()"><span aria-hidden="true" class="text-xl">+</span></button>
      <button x-show="!podeAdicionarVariosAvulsos()" type="button" class="btn-secondary"
              :disabled="!String(draft.descricao||'').trim()"
              @click="usarItemAvulso()">Usar na OP</button>
    </div>
  </label>
  <div x-show="(draft.itens_avulsos||[]).length" x-cloak
       class="grid gap-1.5 mt-2" aria-label="Itens avulsos preparados">
    <template x-for="(item, indice) in (draft.itens_avulsos||[])" :key="item.uid||indice">
      <div class="flex flex-wrap gap-1.5 items-center rounded-lg p-1.5"
           style="background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.22)">
        <input x-model="item.nome" maxlength="160" class="form-input min-w-[140px] flex-1 text-xs"
               :aria-label="`Nome do item avulso ${indice+1}`">
        <input x-model.number="item.quantidade" type="number" min="1" placeholder="Qtd."
               class="form-input text-xs text-center" style="width:76px"
               :aria-label="`Quantidade de ${item.nome}`" title="Quantidade">
        <input x-model="item.valor_unitario" type="number" min="0" step=".01" placeholder="R$"
               class="form-input text-xs" style="width:105px"
               :aria-label="`Valor unitário de ${item.nome}`" title="Valor unitário">
        <button type="button" class="btn-secondary" style="width:32px;height:32px;padding:0;justify-content:center;color:#ef4444"
                :aria-label="`Remover ${item.nome}`" @click="removerItemAvulso(indice)">×</button>
      </div>
    </template>
  </div>
  <small class="block mt-1 opacity-70">
    Use + para incluir vários. Cada linha terá nome, quantidade e valor próprios, não entra em Modelos de Produção e aparece com este nome nos PDFs.
  </small>
</div>
