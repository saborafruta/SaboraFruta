<div class="mt-3 pt-3" style="border-top:1px solid rgba(148,163,184,.22)">
  <label>
    <span class="op2-label">Item avulso</span>
    <div class="flex flex-wrap gap-2">
      <input x-model="draft.descricao" maxlength="160"
             class="form-input flex-1 min-w-[190px]"
             placeholder="Nome do item, ex.: Faixa personalizada"
             @keydown.enter.prevent="usarItemAvulso()">
      <button type="button" class="btn-secondary"
              :disabled="!String(draft.descricao||'').trim()"
              @click="usarItemAvulso()">Usar na OP</button>
    </div>
  </label>
  <small class="block mt-1 opacity-70">
    Fica somente nesta OP, não entra em Modelos de Produção e aparece com este nome nos PDFs.
  </small>
</div>
