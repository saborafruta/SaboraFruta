<div class="md:col-span-2 min-w-0">
  <div class="grid grid-cols-2 gap-3">
    <label class="min-w-0"><span class="op2-label" style="height:32px;display:flex;align-items:center;margin-bottom:4px" data-op2-contact-heading>Responsável</span><input name="contato_nome" x-model="contatoNome" class="form-input w-full" style="height:40px" placeholder="Nome do responsável"></label>
    <label class="min-w-0"><span class="op2-label" style="height:32px;display:flex;align-items:center;margin-bottom:4px" data-op2-contact-heading>WhatsApp</span><input name="contato_telefone" x-model="contatoTelefone" class="form-input w-full" style="height:40px" placeholder="WhatsApp / telefone"></label>
  </div>
  <template x-for="(contato,idx) in contatos" :key="idx">
    <div class="mt-3">
      <div class="grid grid-cols-2 gap-3">
        <label class="min-w-0"><span class="op2-label block">Responsável</span><input name="contato_extra_nome" x-model="contato.nome" class="form-input w-full" placeholder="Nome do responsável"></label>
        <label class="min-w-0"><span class="op2-label block">WhatsApp / telefone</span><input name="contato_extra_telefone" x-model="contato.telefone" class="form-input w-full" placeholder="WhatsApp / telefone"></label>
      </div>
      <button type="button" class="text-xs mt-1" style="color:#ef4444" @click="contatos.splice(idx,1)">Remover contato</button>
    </div>
  </template>
  <div class="flex justify-end mt-2"><button type="button" class="btn-secondary text-xs" @click="contatos.push({nome:'',telefone:''})">+ Contato</button></div>
</div>
