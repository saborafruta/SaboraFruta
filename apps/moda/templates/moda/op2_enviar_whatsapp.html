<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Abrindo WhatsApp</title></head>
<body>
  <p>Orçamento salvo. Abrindo a OP e o WhatsApp…</p>
  {{ op_url|json_script:"op-url" }}
  {{ whatsapp_url|json_script:"whatsapp-url" }}
  <script>
    const opUrl=JSON.parse(document.getElementById('op-url').textContent);
    const whatsappUrl=JSON.parse(document.getElementById('whatsapp-url').textContent);
    if(window.opener&&!window.opener.closed){window.opener.location.assign(opUrl)}
    if(whatsappUrl){window.location.replace(whatsappUrl)}else{window.location.replace(opUrl)}
  </script>
</body>
</html>
