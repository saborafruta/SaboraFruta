<section class="op2-item-gallery" @click.stop>
  <header class="op2-item-gallery-head">
    <strong class="text-sm">Fotos e mockups</strong>
    <span class="op2-chip">{{ item.visuais.all|length }} imagem(ns)</span>
  </header>
  <div class="op2-gallery-grid">
    {% for visual in item.visuais.all %}{% if visual.tem_imagem %}
      <figure class="op2-gallery-image">
        <a href="{{ visual.url_imagem }}" target="_blank" rel="noopener"><img src="{{ visual.url_imagem }}" alt="Imagem de {{ item.nome_exibicao }}"></a>{% if visual.observacoes %}<figcaption class="text-xs mt-1">{{ visual.observacoes }}</figcaption>{% endif %}
        <form class="op2-gallery-remove" method="post" action="{% url 'moda:op2-action' pedido.pk %}" onsubmit="return confirm('Remover esta imagem da OP?')">{% csrf_token %}<input type="hidden" name="acao" value="remover_visual"><input type="hidden" name="visual_id" value="{{ visual.pk }}"><button title="Remover imagem" aria-label="Remover imagem">×</button></form>
        <figcaption>
          <form method="post" action="{% url 'moda:op2-action' pedido.pk %}" class="mt-1"
                x-data="op2LegendaAutomatica()" x-ref="form" @submit.prevent="salvar()"
                @beforeunload.window="avisarSaida($event)" @op2-legenda-salva.window="sincronizar($event.detail)">
            {% csrf_token %}
            <input type="hidden" name="acao" value="descricao_visual">
            <input type="hidden" name="visual_id" value="{{ visual.pk }}">
            <textarea name="descricao" rows="1" maxlength="160" class="form-input w-full"
                      style="min-height:30px;height:30px;padding:5px 7px;font-size:12px;line-height:18px"
                      aria-label="Descrição da imagem" placeholder="Texto da imagem" x-ref="texto"
                      @input="agendar()" @blur="salvar()">{{ visual.observacoes }}</textarea>
            <small x-cloak x-show="estado === 'salvando' || estado === 'salvo'" aria-live="polite"
                   class="block opacity-60" style="font-size:10px" x-text="estado === 'salvando' ? 'Salvando…' : 'Salvo'"></small>
            <button x-cloak x-show="estado === 'erro'" type="button" @click="salvar()"
                    class="text-xs" style="color:#ef4444" role="status">Não foi salvo. Tentar novamente</button>
          </form>
        </figcaption>
      </figure>
    {% endif %}{% endfor %}
    <form method="post" enctype="multipart/form-data" action="{% url 'moda:op2-action' pedido.pk %}">{% csrf_token %}<input type="hidden" name="acao" value="visual_item"><input type="hidden" name="item_id" value="{{ item.pk }}"><label class="op2-plus op2-gallery-add"><input type="file" name="imagens" accept="image/*" multiple class="hidden" onchange="this.form.submit()"><strong aria-hidden="true">+</strong><small>Adicionar imagens</small></label></form>
  </div>
</section>
