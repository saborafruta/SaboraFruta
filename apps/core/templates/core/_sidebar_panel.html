<!-- Painel compartilhado pela navegação principal e pelo drawer do PDV. -->
<div class="flex items-center h-14 px-4 flex-shrink-0" :style="temaClaro ? 'border-bottom:1px solid #e5e5e5;' : 'border-bottom:1px solid #2a2a2e;'">
  <a href="{{ pagina_inicial_url }}" class="flex items-center flex-1 min-w-0" x-show="!collapsed" x-cloak>
    <span class="font-bold truncate" style="font-family:Space Grotesk, sans-serif; letter-spacing:-1px; font-size:20px;"><span :style="temaClaro ? 'color:#111827;' : 'color:#f0f0f0;'">iNoova</span><span :style="temaClaro ? 'color:#e8824a;' : 'color:#3b82f6;'">Ted</span></span>
  </a>
  <a href="{{ pagina_inicial_url }}" x-show="collapsed" x-cloak class="flex items-center justify-center w-full">
    <span class="font-bold" style="font-family:Space Grotesk, sans-serif; font-size:15px; letter-spacing:-0.5px;"><span :style="temaClaro ? 'color:#111827;' : 'color:#f0f0f0;'">i</span><span :style="temaClaro ? 'color:#e8824a;' : 'color:#3b82f6;'">T</span></span>
  </a>
  {% if sidebar_drawer_mode %}
  <button type="button" @click="showSystemMenu = false"
          class="p-1 rounded-lg flex-shrink-0 transition-colors ml-auto"
          :style="temaClaro ? 'color:#64748b;' : 'color:#f8fafc;'"
          onmouseover="this.style.color=temaClaro?'#0f172a':'#f0f0f0'; this.style.background=temaClaro?'#f0f0f0':'#2a2a2e';"
          onmouseout="this.style.color=temaClaro?'#64748b':'#f8fafc'; this.style.background='transparent';"
          title="Recolher menu" aria-label="Recolher menu">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
    </svg>
  </button>
  {% else %}
  <button @click="collapsed = !collapsed; window.__erpSetSidebarCollapsed(collapsed, true)"
          class="p-1 rounded-lg flex-shrink-0 transition-colors"
          :class="collapsed ? 'mx-auto' : 'ml-auto'"
          :style="temaClaro ? 'color:#aaa;' : 'color:#f8fafc;'"
          onmouseover="this.style.color=temaClaro?'#333':'#f0f0f0'; this.style.background=temaClaro?'#f0f0f0':'#2a2a2e';"
          onmouseout="this.style.color=temaClaro?'#aaa':'#f8fafc'; this.style.background='transparent';"
          :title="collapsed ? 'Expandir menu' : 'Recolher menu'">
    <svg class="w-4 h-4 transition-transform" :class="collapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
    </svg>
  </button>
  {% endif %}
</div>

<nav class="sidebar-scroll sidebar-favorites-nav flex-1 overflow-y-auto overflow-x-hidden py-3 px-2 space-y-0.5">
  {% include "core/_sidebar_navigation.html" %}
</nav>

<div class="p-2" :style="temaClaro ? 'border-top:1px solid #e5e5e5;' : 'border-top:1px solid #2a2a2e;'">
  <a href="{% url 'core:logout' %}"
     class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150"
     :class="collapsed ? 'justify-center' : ''"
     :style="temaClaro ? 'background:#fff0f0; color:#e24b4a; border:0.5px solid rgba(226,75,74,0.2);' : 'background:rgba(239,68,68,0.08); color:#f87171; border:0.5px solid rgba(239,68,68,0.15);'"
     title="Sair"
     onmouseover="this.style.background=temaClaro?'#ffe4e4':'rgba(239,68,68,0.18)'; this.style.borderColor=temaClaro?'rgba(226,75,74,0.4)':'rgba(239,68,68,0.35)';"
     onmouseout="this.style.background=temaClaro?'#fff0f0':'rgba(239,68,68,0.08)'; this.style.borderColor=temaClaro?'rgba(226,75,74,0.2)':'rgba(239,68,68,0.15)';">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    <span x-show="!collapsed" x-cloak>Sair</span>
  </a>
</div>
